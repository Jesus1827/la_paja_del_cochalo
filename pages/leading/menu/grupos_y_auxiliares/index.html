<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grupos Contables</title>
    <link rel="stylesheet" href="../../../../css/styles_main/GruposContables.css">
</head>

<body>
    <div class="pantalla-grupo">
        <div class="zona-negra">GRUPOS CONTABLES</div>
        <div class="titulo-azul-brillante">GRUPO CONTABLE</div>

        <div class="cuerpo-formulario">
            <div class="cuadricula-datos">
                <div class="campo-pequeno">
                    <label>Grupo</label>
                    <input type="text" value="2" class="cuadrito-crema">
                </div>
                <div class="campo-grande">
                    <label>Nombre</label>
                    <select class="cuadrito-crema">
                        <option>MUEBLES Y ENSERES DE OFICINA</option>
                    </select>
                </div>
                <div class="campo-pequeno">
                    <label>Vida Util</label>
                    <input type="text" value="10" class="cuadrito-crema">
                </div>
                <div class="campo-grande">
                    <label>Observaciones</label>
                    <textarea class="cuadrito-crema-grande"></textarea>
                </div>
            </div>

            <div class="seccion-checkbox">
                <label>Deprecia</label>
                <input type="checkbox" checked>
            </div>

            <div class="contenedor-tabla">
                <table class="tabla-estilo-viejo">
                    <thead>
                        <tr>
                            <th style="width: 20%;">CODIGO</th>
                            <th>NOMBRE AUXILIAR</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr>
                            <td>1</td>
                            <td>ACONDICIONADOR DE AIRE</td>
                        </tr>
                        <tr>
                            <td>2</td>
                            <td>ALACENA</td>
                        </tr>
                        <tr class="linea-azul-claro">
                            <td>3</td>
                            <td>ALFOMBRA O TAPIZ</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</body>

</html>
